name: build-myspeed

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/ljw98/MySpeed.git src

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: src/frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Copy frontend into Go embed dir
        run: |
          rm -rf src/backend-go/static/*
          mkdir -p src/backend-go/static
          cp -r src/frontend/dist/* src/backend-go/static/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        working-directory: src/backend-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/myspeed-linux-amd64" .
          ls -la "$GITHUB_WORKSPACE/myspeed-linux-amd64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myspeed-linux-amd64
          path: myspeed-linux-amd64
          retention-days: 30